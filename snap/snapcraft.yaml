name: mlx-serve
base: core24
version: '26.11.2'
title: MLX-Serve
summary: Local model inference with OpenAI, Anthropic and Ollama APIs
description: |
  Run local models through a native command-line server and browser console.
  MLX-Serve provides OpenAI, Anthropic and Ollama-compatible HTTP APIs and
  downloads models from Hugging Face.

  This Linux package requires a supported NVIDIA GPU and host driver 580 or
  newer. It includes the CUDA runtime and supports amd64 and arm64 systems.
  The optional system daemon is disabled until explicitly configured.
grade: stable
confinement: strict
license: MIT
icon: snap/gui/mlx-serve.png
website: https://github.com/ddalcu/mlx-serve
contact: https://github.com/sidalit/mlx-serve-snap/issues
source-code:
  - https://github.com/sidalit/mlx-serve-snap
  - https://github.com/ddalcu/mlx-serve
issues:
  - https://github.com/sidalit/mlx-serve-snap/issues
  - https://github.com/ddalcu/mlx-serve/issues

platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/
    path: /
    architectures:
      - amd64
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC
  - type: apt
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/
    path: /
    architectures:
      - arm64
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC

apps:
  mlx-serve:
    command: libexec/mlx-serve/cli.sh
    plugs:
      - network
      - network-bind
      - opengl
      - home
      - removable-media
  daemon:
    command: libexec/mlx-serve/daemon.sh
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    stop-timeout: 60s
    plugs:
      - network
      - network-bind
      - opengl

parts:
  mlx-serve-source:
    plugin: dump
    source: https://github.com/ddalcu/mlx-serve.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    source-submodules: []
    override-pull: |
      craftctl default
      # Fetch the submodules this commit still lists; upstream drops some over
      # time. MLX, MLX-C and ds4 are built at the commits recorded here.
      listed=$(git config --file .gitmodules --get-regexp '\.path$' | cut -d' ' -f2)
      submodules=()
      for path in lib/ds4 lib/mlx-src lib/mlxc-src \
        lib/opencode2-mlx-serve lib/mlx-serve-gguf lib/sushi; do
        if grep -qxF "$path" <<< "$listed"; then
          submodules+=("$path")
        fi
      done
      git submodule update --init --recursive -- "${submodules[@]}"
      for path in lib/ds4 lib/mlx-src lib/mlxc-src; do
        printf '%s %s\n' "$path" "$(git -C "$path" rev-parse HEAD)"
      done > snap-submodule-commits
    organize:
      '*': usr/src/mlx-serve/
    prime:
      - -*

  zig:
    plugin: dump
    source:
      - on amd64: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
      - on arm64: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
    source-type: tar
    organize:
      '*': opt/zig/
    prime:
      - -*

  json-source:
    plugin: dump
    source: https://github.com/nlohmann/json.git
    source-tag: v3.11.3
    source-depth: 1
    source-submodules: []
    organize:
      '*': usr/src/json/
    prime:
      - -*

  fmt-source:
    plugin: dump
    source: https://github.com/fmtlib/fmt.git
    source-tag: 12.1.0
    source-depth: 1
    source-submodules: []
    organize:
      '*': usr/src/fmt/
    prime:
      - -*

  cccl-source:
    plugin: dump
    source: https://github.com/NVIDIA/cccl/releases/download/v3.1.3/cccl-v3.1.3.zip
    source-type: zip
    source-subdir: cccl-v3.1.3
    organize:
      '*': usr/src/cccl/
    prime:
      - -*

  nvtx-source:
    plugin: dump
    source: https://github.com/NVIDIA/NVTX.git
    source-tag: v3.1.1
    source-depth: 1
    source-submodules: []
    organize:
      '*': usr/src/nvtx/
    prime:
      - -*

  cudnn-frontend-source:
    plugin: dump
    source: https://github.com/NVIDIA/cudnn-frontend.git
    source-tag: v1.16.0
    source-depth: 1
    source-submodules: []
    organize:
      '*': usr/src/cudnn-frontend/
    prime:
      - -*

  cutlass-source:
    plugin: dump
    source: https://github.com/NVIDIA/cutlass.git
    source-tag: v4.4.2
    source-depth: 1
    source-submodules: []
    organize:
      '*': usr/src/cutlass/
    prime:
      - -*

  mlx:
    plugin: nil
    after:
      - mlx-serve-source
      - json-source
      - fmt-source
      - cccl-source
      - nvtx-source
      - cudnn-frontend-source
      - cutlass-source
    build-packages:
      - build-essential
      - cmake
      - git
      - cuda-toolkit-13-4
      - libcudnn9-dev-cuda-13
      - liblapacke-dev
      - libopenblas-dev
    build-environment: &cuda-build-environment
      - CUDA_HOME: /usr/local/cuda-13.4
      - PATH: /usr/local/cuda-13.4/bin:$CRAFT_STAGE/opt/zig:$PATH
      - on amd64:
          - CUDA_ARCH: '75;86;120'
          - ZIG_CPU: x86_64_v3
          - NATIVE_CPU_FLAG: -march=x86-64-v3
      - on arm64:
          - CUDA_ARCH: '90;110;121'
          - ZIG_CPU: baseline
          - NATIVE_CPU_FLAG: -march=armv8.2-a+dotprod
    override-build: |
      set -euo pipefail
      # Release builds use the MLX from upstream's release tarball instead.
      case "$SNAPCRAFT_PROJECT_VERSION" in git-*) ;; *) exit 0 ;; esac
      src="$CRAFT_STAGE/usr/src/mlx-serve"
      cp -a "$src/lib/mlx-src/." .
      rm -rf .git
      # Apply the MLX patches in the order upstream's Linux build uses.
      patches=$(grep -oE 'patches/mlx-cuda-[a-z0-9-]+\.patch' \
        "$src/scripts/build-mlx-linux.sh" | awk '!seen[$0]++')
      for patch in $patches; do
        if ! git apply --reverse --check "$src/$patch" 2>/dev/null; then
          git apply "$src/$patch"
        fi
      done

      cmake -S . -B snap-build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/lib/mlx \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH='$ORIGIN' \
        -DCMAKE_C_FLAGS="$NATIVE_CPU_FLAG" \
        -DCMAKE_CXX_FLAGS="$NATIVE_CPU_FLAG" \
        -DBUILD_SHARED_LIBS=ON \
        -DMLX_BUILD_METAL=OFF \
        -DMLX_BUILD_CPU=ON \
        -DMLX_BUILD_CUDA=ON \
        -DMLX_CUDA_ARCHITECTURES="$CUDA_ARCH" \
        -DMLX_BUILD_PYTHON_BINDINGS=OFF \
        -DMLX_BUILD_GGUF=OFF \
        -DMLX_BUILD_TESTS=OFF \
        -DMLX_BUILD_BENCHMARKS=OFF \
        -DMLX_BUILD_EXAMPLES=OFF \
        -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
        -DLAPACK_INCLUDE_DIRS=/usr/include \
        -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
        -DFETCHCONTENT_SOURCE_DIR_JSON="$CRAFT_STAGE/usr/src/json" \
        -DFETCHCONTENT_SOURCE_DIR_FMT="$CRAFT_STAGE/usr/src/fmt" \
        -DFETCHCONTENT_SOURCE_DIR_CCCL="$CRAFT_STAGE/usr/src/cccl" \
        -DFETCHCONTENT_SOURCE_DIR_NVTX3="$CRAFT_STAGE/usr/src/nvtx" \
        -DFETCHCONTENT_SOURCE_DIR_CUDNN="$CRAFT_STAGE/usr/src/cudnn-frontend" \
        -DFETCHCONTENT_SOURCE_DIR_CUTLASS="$CRAFT_STAGE/usr/src/cutlass"
      cmake --build snap-build --parallel "$CRAFT_PARALLEL_BUILD_COUNT"
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install snap-build

      # The server embeds a few Metal source headers even on its Linux build path.
      mkdir -p "$CRAFT_PART_INSTALL/usr/src/mlx/mlx/backend/metal/kernels"
      cp -a mlx/backend/metal/kernels/steel \
        "$CRAFT_PART_INSTALL/usr/src/mlx/mlx/backend/metal/kernels/"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/mlx/LICENSE"
    prime:
      - -usr/src
      - -lib/mlx/lib/cmake
      - -lib/mlx/share

  mlxc:
    plugin: nil
    after:
      - mlx-serve-source
      - mlx
    build-environment: *cuda-build-environment
    override-build: |
      set -euo pipefail
      # Release builds use the MLX-C from upstream's release tarball instead.
      case "$SNAPCRAFT_PROJECT_VERSION" in git-*) ;; *) exit 0 ;; esac
      cp -a "$CRAFT_STAGE/usr/src/mlx-serve/lib/mlxc-src/." .
      rm -rf .git
      patches="$CRAFT_STAGE/usr/src/mlx-serve/patches"
      if ! git apply --reverse --check "$patches/mlxc-gather-qmm-global-scale.patch" 2>/dev/null; then
        git apply "$patches/mlxc-gather-qmm-global-scale.patch"
      fi
      if ! git apply --reverse --check "$patches/mlxc-x86-f16-data-alias.patch" 2>/dev/null; then
        git apply "$patches/mlxc-x86-f16-data-alias.patch"
      fi
      cmake -S . -B snap-build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/lib/mlx \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH='$ORIGIN' \
        -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
        -DCMAKE_C_FLAGS="$NATIVE_CPU_FLAG" \
        -DCMAKE_CXX_FLAGS="$NATIVE_CPU_FLAG" \
        -DBUILD_SHARED_LIBS=ON \
        -DMLX_C_USE_SYSTEM_MLX=ON \
        -DMLX_C_BUILD_EXAMPLES=OFF \
        -DCMAKE_PREFIX_PATH="$CRAFT_STAGE/lib/mlx" \
        -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      cmake --build snap-build --target mlxc --parallel "$CRAFT_PARALLEL_BUILD_COUNT"
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install snap-build
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/mlx-c/LICENSE"
    prime:
      - -lib/mlx/lib/cmake

  ds4:
    plugin: nil
    after:
      - mlx-serve-source
    build-packages:
      - build-essential
      - cuda-toolkit-13-4
    build-environment: *cuda-build-environment
    override-build: |
      set -euo pipefail
      # Release builds use the ds4 library from upstream's release tarball instead.
      case "$SNAPCRAFT_PROJECT_VERSION" in git-*) ;; *) exit 0 ;; esac
      cp -a "$CRAFT_STAGE/usr/src/mlx-serve/lib/ds4/." .
      rm -rf .git
      # Isolate the GNU C++ runtime from Zig's exception machinery.
      IFS=';' read -r -a arches <<< "$CUDA_ARCH"
      gencode=''
      for arch in "${arches[@]}"; do
        case "$arch" in 120|121) arch="${arch}a" ;; esac
        gencode+=" -gencode arch=compute_$arch,code=[sm_$arch,compute_$arch]"
      done
      make_args=("CC=cc -fPIC" "NVCC_ARCH_FLAGS=$gencode")
      export NVCC_APPEND_FLAGS=-Xcompiler=-fPIC
      read -r -a objects <<< "$(make -s "${make_args[@]}" \
        --eval='print-core-objs: ; @echo $(CORE_OBJS)' print-core-objs)"
      make -j"$CRAFT_PARALLEL_BUILD_COUNT" "${make_args[@]}" "${objects[@]}"
      printf '{ global: ds4_*; local: *; };\n' > snap-exports.map
      g++ -shared -o libds4.so "${objects[@]}" \
        -Wl,-Bsymbolic -Wl,--version-script=snap-exports.map \
        -static-libstdc++ -static-libgcc -L"$CUDA_HOME/lib64" -lcudart -lcublas
      install -Dm755 libds4.so "$CRAFT_PART_INSTALL/lib/ds4-linux/libds4.so"
      mkdir -p "$CRAFT_PART_INSTALL/usr/src/ds4"
      cp -a ./*.h "$CRAFT_PART_INSTALL/usr/src/ds4/"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/ds4/LICENSE"
    prime:
      - -usr/src

  llama:
    plugin: nil
    after:
      - mlx-serve-source
    build-packages:
      - ca-certificates
      - curl
      - python3
    override-build: |
      set -euo pipefail
      # Use the official llama.cpp CUDA build pinned by upstream's
      # scripts/fetch-llama.sh, as upstream's Linux CI and releases do.
      fetch="$CRAFT_STAGE/usr/src/mlx-serve/scripts/fetch-llama.sh"
      tag=$(sed -n 's/^LLAMA_TAG="${LLAMA_TAG:-\(b[0-9]*\)}"$/\1/p' "$fetch")
      cuda=$(sed -n 's/^ *URL="$RELEASE\/llama-${LLAMA_TAG}-bin-ubuntu-cuda-\([0-9.]*\)-${ARCH}\.tar\.gz"$/\1/p' "$fetch")
      if [ -z "$tag" ] || [ "$cuda" != 13.4 ]; then
        echo "Unexpected llama.cpp pin in fetch-llama.sh: '$tag' for CUDA '$cuda'" >&2
        exit 1
      fi
      case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
      asset="llama-$tag-bin-ubuntu-cuda-$cuda-$arch.tar.gz"
      digest=$(curl -fsSL "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$tag" |
        python3 -c 'import json, sys; print(next(a["digest"] for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]))' "$asset")
      curl -fL -o prebuilt.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$tag/$asset"
      echo "${digest#sha256:}  prebuilt.tar.gz" | sha256sum --check --strict
      curl -fL -o source.tar.gz "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$tag.tar.gz"
      mkdir -p prebuilt source
      tar -xzf prebuilt.tar.gz -C prebuilt
      tar -xzf source.tar.gz -C source --strip-components=1
      llama="$CRAFT_PART_INSTALL/lib/llama"
      mkdir -p "$llama/lib" "$llama/include"
      find prebuilt \( -name 'libllama.so*' -o -name 'libggml*.so*' \) -exec cp -P {} "$llama/lib/" \;
      cp source/include/*.h source/ggml/include/*.h "$llama/include/"
      printf '%s\n' "$tag" > "$llama/.version"
      install -Dm644 source/LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/llama.cpp/LICENSE"
    prime:
      - -lib/llama/include

  mlx-serve:
    plugin: nil
    after:
      - mlx-serve-source
      - zig
      - mlxc
      - ds4
      - llama
    build-packages:
      - ca-certificates
      - curl
      - libavahi-compat-libdnssd-dev
      - libwebp-dev
      - pkg-config
      - python3
    build-environment: *cuda-build-environment
    override-build: |
      set -euo pipefail
      src="$CRAFT_STAGE/usr/src/mlx-serve"
      case "$SNAPCRAFT_PROJECT_VERSION" in
        git-*)
          cp -a "$src/." .
          # The parts above build these submodules; Zig gets only their headers.
          rm -rf lib/ds4 lib/mlx-src lib/mlxc-src
          mkdir -p lib/ds4 lib/mlx-src lib/mlxc-src
          cp -a "$CRAFT_STAGE/lib/mlx" lib/
          cp -a "$CRAFT_STAGE/lib/llama" lib/
          cp -a "$CRAFT_STAGE/lib/ds4-linux" lib/
          cp -a "$CRAFT_STAGE/usr/src/ds4/." lib/ds4/
          cp -a "$CRAFT_STAGE/usr/src/mlx/." lib/mlx-src/
          commit() {
            awk -v path="$1" '$1 == path { print $2; found = 1 } END { exit !found }' \
              snap-submodule-commits
          }
          mlx_commit=$(commit lib/mlx-src)
          mlxc_commit=$(commit lib/mlxc-src)
          ds4_commit=$(commit lib/ds4)

          # Include both upstream patches and this recipe in the runtime PTX cache key.
          patch_stamp=$(cat patches/mlx*.patch "$CRAFT_PROJECT_DIR/snap/snapcraft.yaml" | sha256sum | cut -c1-16)
          printf 'mlx=%s mlxc=%s backend=cuda cuda_arch=%s inputs=%s\n' \
            "$mlx_commit" "$mlxc_commit" "$CUDA_ARCH" "$patch_stamp" > lib/mlx/.version

          mkdir -p snap-jinja
          for unit in caps lexer parser runtime jinja_string value jinja_wrapper; do
            zig c++ -std=c++17 -O2 -DNDEBUG -mcpu="$ZIG_CPU" -I lib/jinja_cpp \
              -c "lib/jinja_cpp/$unit.cpp" -o "snap-jinja/$unit.o"
          done
          ar rcsD lib/jinja_cpp/libjinja-linux.a snap-jinja/*.o
          zig build -Doptimize=ReleaseFast -Dcpu="$ZIG_CPU" \
            -Dversion="$SNAPCRAFT_PROJECT_VERSION" -Dds4-commit="${ds4_commit:0:7}"
          install -Dm755 zig-out/bin/mlx-serve "$CRAFT_PART_INSTALL/zig-out/bin/mlx-serve"
          install -Dm644 lib/mlx/.version "$CRAFT_PART_INSTALL/lib/mlx/.version"
          ;;
        *)
          # Releases attach the Linux build from upstream's CI, with the same
          # CUDA targets and MLX patches; use it instead of compiling. The llama
          # part supplies llama.cpp, as in HEAD builds.
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; esac
          tag="v$SNAPCRAFT_PROJECT_VERSION"
          asset="mlx-serve-linux-$arch-cuda13.tar.gz"
          digest=$(curl -fsSL "https://api.github.com/repos/ddalcu/mlx-serve/releases/tags/$tag" |
            python3 -c 'import json, sys; print(next(a["digest"] for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]))' "$asset")
          curl -fL -o release.tar.gz "https://github.com/ddalcu/mlx-serve/releases/download/$tag/$asset"
          echo "${digest#sha256:}  release.tar.gz" | sha256sum --check --strict
          tar -xzf release.tar.gz -C "$CRAFT_PART_INSTALL" \
            zig-out/bin/mlx-serve lib/mlx/lib lib/mlx/include lib/ds4-linux/libds4.so
          install -Dm644 "$src/lib/mlx-src/LICENSE" "$CRAFT_PART_INSTALL/usr/share/doc/mlx/LICENSE"
          install -Dm644 "$src/lib/mlxc-src/LICENSE" "$CRAFT_PART_INSTALL/usr/share/doc/mlx-c/LICENSE"
          install -Dm644 "$src/lib/ds4/LICENSE" "$CRAFT_PART_INSTALL/usr/share/doc/ds4/LICENSE"
          ;;
      esac
      for license in LICENSE LICENSE-APACHE-2.0 NOTICE; do
        install -Dm644 "$src/$license" "$CRAFT_PART_INSTALL/usr/share/doc/mlx-serve/$license"
      done

  runtime:
    plugin: dump
    source: snap/local/runtime
    organize:
      '*.sh': libexec/mlx-serve/
    build-packages:
      - ca-certificates
    stage-packages:
      - curl
      - libavahi-compat-libdnssd1
      - liblapacke
      - libopenblas0-pthread
      - libwebp7
      - libgomp1
      # Header packages are intentional: MLX JIT compiles CUDA kernels at runtime.
      - cuda-cudart-dev-13-4
      - cuda-crt-13-4
      - cuda-nvrtc-13-4
      - libcublas-13-4
      - libcufft-13-4
      - libcusolver-13-4
      - libcusparse-13-4
      - libnvjitlink-13-4
      - libcudnn9-cuda-13
    override-build: |
      craftctl default
      install -Dm644 /etc/ssl/certs/ca-certificates.crt \
        "$CRAFT_PART_INSTALL/etc/ssl/certs/ca-certificates.crt"
    prime:
      # The host supplies libcuda.so.1. Never ship CUDA's nonfunctional driver stubs.
      - -usr/local/cuda-13.4/targets/*/lib/stubs
      - -usr/local/cuda-13.4/targets/*/lib/*.a
      - -usr/local/cuda-13.4/lib64/stubs
      - -usr/local/cuda-13.4/bin
      - -usr/local/cuda-13.4/nvvm
